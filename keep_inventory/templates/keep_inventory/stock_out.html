{% extends "keep_inventory/base.html" %}
{% load bootstrap4 %}

{% block page_header %}
<h2>Remove Product</h2>
{% endblock page_header %}

{% block content %}
   
    <form method="post" action="{% url 'keep_inventory:stock_out' %}" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% buttons %}
            <button type="submit" class="btn btn-primary">Save</button>
        {% endbuttons %}
    </form>
{% endblock content %}
